<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Customer Segmentation{% endblock %}</title>
<style>
  :root { --line:#e2e2e2; --muted:#666; --ink:#111; --bg:#fff; --accent:#1a1a1a; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); background:var(--bg); }
  header { border-bottom:1px solid var(--line); padding:14px 24px; display:flex;
           gap:22px; align-items:baseline; flex-wrap:wrap; }
  header b { font-size:15px; }
  header a { color:var(--muted); text-decoration:none; font-size:14px; }
  header a:hover, header a.on { color:var(--ink); }
  main { max-width:1080px; margin:0 auto; padding:28px 24px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:28px; }
  .card { border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  .card .n { font-size:22px; font-weight:600; }
  .card .l { color:var(--muted); font-size:13px; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { font-weight:600; color:var(--muted); font-size:13px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .note { border-left:3px solid var(--line); padding:10px 14px; color:var(--muted);
          font-size:14px; margin:20px 0; }
  form.filters { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  input,select,button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:4px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  .field { margin-bottom:14px; max-width:380px; }
  .field label { display:block; font-size:14px; margin-bottom:4px; }
  .field input { width:100%; }
  .field .help { color:var(--muted); font-size:12px; margin-top:3px; }
  .bar { height:7px; background:#eee; border-radius:4px; overflow:hidden; }
  .bar span { display:block; height:100%; background:var(--accent); }
  #result { margin-top:18px; }
  code { background:#f5f5f5; padding:1px 5px; border-radius:3px; font-size:13px; }
</style>
</head>
<body>
<header>
  <b>Customer Segmentation</b>
  <a href="/">Overview</a>
  <a href="{% url 'customer_analytics:dashboard' %}">Dashboard</a>
  <a href="{% url 'customer_analytics:customer_list' %}">Customers</a>
  <a href="{% url 'customer_analytics:predict' %}">Assign segment</a>
  <a href="{% url 'customer_analytics:etl_status' %}">Pipeline</a>
  <a href="{% url 'customer_analytics:model_info' %}">Models</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
